# Opt-in, isolated local CI project. Never include this file in production Compose.
name: cloudharness-local-ci

services:
  ci-worker:
    profiles: [ci]
    image: cloudharness-local-ci:node24
    build:
      context: .
      dockerfile: docker/local-ci.Dockerfile
    init: true
    user: "1000:1000"
    working_dir: /work
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    volumes:
      - type: bind
        source: ${CI_WORKTREE_HOST:?Set CI_WORKTREE_HOST to a trusted local checkout}
        target: /work
      - type: bind
        source: ${CI_CACHE_HOST:?Set CI_CACHE_HOST to an operator-owned cache directory}
        target: /cache
      - type: bind
        source: ${CI_REPORT_HOST:?Set CI_REPORT_HOST to an operator-owned reports directory}
        target: /reports
    environment:
      CI: "true"
      NPM_CONFIG_CACHE: /cache/npm
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    # Default: no daemon, no ports and no Docker socket; operator starts one job.
    command: [node-basic]
