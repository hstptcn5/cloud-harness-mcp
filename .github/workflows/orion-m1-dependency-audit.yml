name: Orion M1 exact-lockfile online security audit
on:
  push:
    branches: [audit/orion-m1-npm-registry-20261018]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.0
      - name: Verify exact target commit
        run: git cat-file -e 4cb540ac925aa113542861f65331cdb81c4760df^{commit} && git merge-base --is-ancestor 4cb540ac925aa113542861f65331cdb81c4760df HEAD && git diff --quiet 4cb540ac925aa113542861f65331cdb81c4760df HEAD -- package-lock.json package.json apps/api/package.json apps/runner/package.json apps/agent-runtime/package.json
      - name: Registry-backed audit of complete and production lockfile
        run: |
          npm audit --json > audit-full.json || true
          npm audit --omit=dev --json > audit-production.json || true
          npm audit --omit=dev --workspace @cloud-harness/api --json > audit-api-scope.json || true
          npm audit --omit=dev --workspace @cloud-harness/runner --json > audit-runner-scope.json || true
          npm audit --omit=dev --workspace @cloud-harness/agent-runtime --json > audit-agent-scope.json || true
          for p in audit-full.json audit-production.json audit-api-scope.json audit-runner-scope.json audit-agent-scope.json; do
            AUDIT_FILE="$p" node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.env.AUDIT_FILE));const v=r.vulnerabilities||{};console.log("AUDIT_SUMMARY",JSON.stringify({file:process.env.AUDIT_FILE,metadata:r.metadata?.vulnerabilities,error:r.error||null}));for(const [name,x] of Object.entries(v)){if(!["high","critical"].includes(x.severity))continue;console.log("AUDIT_ITEM",JSON.stringify({file:process.env.AUDIT_FILE,name,severity:x.severity,isDirect:x.isDirect,range:x.range,nodes:x.nodes,fixAvailable:x.fixAvailable,via:x.via}));}' 
          done
      - uses: actions/upload-artifact@v4
        with:
          name: orion-m1-exact-lockfile-audit
          path: audit-*.json
          retention-days: 14
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: [api, runner, agent]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 10
      - name: Verify target source and build effective runtime image
        run: |
          git cat-file -e 4cb540ac925aa113542861f65331cdb81c4760df^{commit} && git merge-base --is-ancestor 4cb540ac925aa113542861f65331cdb81c4760df HEAD
          docker build -f docker/${{ matrix.image }}.Dockerfile -t orion-m1-audit-${{ matrix.image }}:local .
      - name: Registry-backed audit inside final post-prune image
        run: |
          docker run --rm --entrypoint npm orion-m1-audit-${{ matrix.image }}:local audit --omit=dev --json > image-${{ matrix.image }}-audit.json || true
          docker run --rm --entrypoint npm orion-m1-audit-${{ matrix.image }}:local ls --omit=dev --all --json > image-${{ matrix.image }}-tree.json || true
          AUDIT_FILE=image-${{ matrix.image }}-audit.json node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync(process.env.AUDIT_FILE));console.log("IMAGE_SUMMARY",JSON.stringify({image:process.env.AUDIT_FILE,metadata:r.metadata?.vulnerabilities,error:r.error||null}));for(const [name,x] of Object.entries(r.vulnerabilities||{})){if(!["high","critical"].includes(x.severity))continue;console.log("IMAGE_ITEM",JSON.stringify({image:process.env.AUDIT_FILE,name,severity:x.severity,isDirect:x.isDirect,range:x.range,nodes:x.nodes,fixAvailable:x.fixAvailable,via:x.via}));}'
      - uses: actions/upload-artifact@v4
        with:
          name: orion-m1-post-prune-${{ matrix.image }}
          path: image-${{ matrix.image }}-*.json
          retention-days: 14

  mcp-bounded-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.0
      - name: Build API only for bounded local HTTP test
        run: |
          git diff --quiet 4cb540ac925aa113542861f65331cdb81c4760df HEAD -- package-lock.json apps/api/package.json apps/runner/package.json
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build -w @cloud-harness/contracts
          npm run build -w @cloud-harness/api
      - name: Bounded MCP batch and trust-proxy probe against loopback only
        run: |
          node --input-type=module <<'JS'
          import {createServer} from 'node:http';
          import {once} from 'node:events';
          import {createApiApp} from './apps/api/dist/app.js';
          const bearer='m1-audit-owner-token-longer-than-32-chars';
          const cfg={
            host:'127.0.0.1',port:0,ownerId:'owner',bearerToken:bearer,runnerUrl:'http://127.0.0.1:1',
            runnerToken:'m1-test-runner-service-token-longer-32',
            publicHosts:['127.0.0.1'],allowedOrigins:[],requestTimeoutMs:5000,maxBodyBytes:1048576,
            mcpGatewayTimeoutMs:30000,mcpGatewayMaxResponseBytes:262144,mcpGatewayMaxToolsPerServer:500,
            mcpGatewayMaxSchemaBytes:65536,mcpGatewayMaxCatalogBytes:2097152,mcpGatewayMaxTraceRows:20000,
            mcpGatewayMaxConnections:32,mcpGatewayAllowInsecureHttp:false,mcpGatewayAllowPrivateEndpoints:false
          };
          const rt=createApiApp(cfg);
          const srv=createServer(rt.app);
          try{
            srv.listen(0,'127.0.0.1');await once(srv,'listening');
            const port=srv.address().port;
            const batch=Array.from({length:101},(_,i)=>({jsonrpc:'2.0',method:'ping',id:i+1,params:{}}));
            const payload=JSON.stringify(batch);
            if(Buffer.byteLength(payload)>20000)throw Error('probe unexpectedly oversized');
            const response=await fetch('http://127.0.0.1:'+port+'/mcp',{
              method:'POST',headers:{authorization:'Bearer '+bearer,'content-type':'application/json',
                accept:'application/json, text/event-stream','mcp-protocol-version':'2026-07-28'},
              body:payload,signal:AbortSignal.timeout(4000)
            });
            const body=await response.text();
            console.log('MCP_BATCH_PROBE',JSON.stringify({batchLength:batch.length,bodyBytes:payload.length,
              httpStatus:response.status,contentType:response.headers.get('content-type'),
              resultPrefix:body.slice(0,350),trustProxy:rt.app.get('trust proxy')}));
          } finally {
            await rt.close();
            if(srv.listening)await new Promise(resolve=>srv.close(resolve));
          }
          JS
